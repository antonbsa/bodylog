<style>
/* ---------- Theme tokens ---------- */
:root {
  --bg: #f4f4f1;
  --surface: #ffffff;
  --surface-2: #f1f1ee;
  --seg-bg: #e8e8e4;

  --scrim: rgba(0, 0, 0, 0.4);
  --lime: #55701c;
  --lime-fg: #ffffff;
  --lime-tint: #e9efd6;

  --blue-fg: #ffffff;
  --blue-tint: #e4edf7;
  --amber: #98620f;
  --amber-fg: #ffffff;
  --amber-tint: #f5ead8;
  --vivid: #0969da;
  --vivid-fg: #ffffff;
  --vivid-tint: #ddf4ff;

  --accent-tint: var(--lime-tint);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111111;
    --surface: #1c1c1c;
    --surface-2: #272727;
    --seg-bg: #262626;
    --seg-on: #3b3b3b;
    --fg: #f0f0f0;
    --fg-2: #a6a6a6;
    --fg-3: #949494;
    --line: #2e2e2e;
    --bar: #161616;
    --shadow: none;
    --danger: #f2938b;
    --dot: #808080;
    --scrim: rgba(0, 0, 0, 0.6);
    --lime: #b4c86a;
    --lime-fg: #1a2008;
    --lime-tint: #2d311c;
    --blue: #8fb3e0;
    --blue-fg: #0d1a2b;
    --blue-tint: #1f2a38;
    --amber: #e0b062;
    --amber-fg: #2a1b04;
    --amber-tint: #38301e;
    --vivid: #58a6ff;
    --vivid-fg: #0b1a2e;
    --vivid-tint: #172a42;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111111;
  --surface: #1c1c1c;
  --surface-2: #272727;
  --seg-bg: #262626;
  --seg-on: #3b3b3b;
  --fg: #f0f0f0;
  --fg-2: #a6a6a6;
  --fg-3: #949494;
  --line: #2e2e2e;
  --bar: #161616;
  --shadow: none;
  --danger: #f2938b;
  --dot: #808080;
  --scrim: rgba(0, 0, 0, 0.6);
  --lime: #b4c86a;
  --lime-fg: #1a2008;
  --lime-tint: #2d311c;
  --blue: #8fb3e0;
  --blue-fg: #0d1a2b;
  --blue-tint: #1f2a38;
  --amber: #e0b062;
  --amber-fg: #2a1b04;
  --amber-tint: #38301e;
  --vivid: #58a6ff;
  --vivid-fg: #0b1a2e;
  --vivid-tint: #172a42;
  color-scheme: dark;
}
:root[data-accent="blue"] { --accent: var(--blue); --accent-fg: var(--blue-fg); --accent-tint: var(--blue-tint); }
:root[data-accent="amber"] { --accent: var(--amber); --accent-fg: var(--amber-fg); --accent-tint: var(--amber-tint); }
:root[data-accent="vivid"] { --accent: var(--vivid); --accent-fg: var(--vivid-fg); --accent-tint: var(--vivid-tint); }
:root[data-accent="lime"] { --accent: var(--lime); --accent-fg: var(--lime-fg); --accent-tint: var(--lime-tint); }

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 16px;
  line-height: 1.4;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[tabindex="-1"]:focus { outline: none; }
.num { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { display: block; flex: none; }

.app { position: relative; height: 100%; display: flex; flex-direction: column; width: 100%; max-width: 430px; margin: 0 auto; background: var(--bg); }
@media (min-width: 521px) { .app { border-left: 1px solid var(--line); border-right: 1px solid var(--line); } }
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.main { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding-top: 16px; padding-bottom: 28px; }
.title { font-size: 34px; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em; margin: 8px 0 20px; }
.card { background: var(--surface); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); }
.card + .card, .card + .seg, .seg + .card, .card + .sec-title { margin-top: 12px; }
h2 { margin: 0; font-size: 17px; font-weight: 600; }
.muted { color: var(--fg-2); }
.small { font-size: 13px; }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 20px; border: 0; border-radius: 14px; font-size: 17px; font-weight: 600; background: var(--accent); color: var(--accent-fg); }
.btn.block { width: 100%; }
.btn.ghost { background: var(--surface-2); color: var(--fg); min-height: 44px; font-size: 15px; font-weight: 500; padding: 0 16px; }
.btn.danger { background: var(--surface-2); color: var(--danger); }
.btn.link { background: transparent; color: var(--fg); min-height: 44px; padding: 0 8px; font-size: 16px; font-weight: 500; }
.btn.link.danger { color: var(--danger); }

/* ---------- Segmented ---------- */
.seg { display: flex; gap: 2px; background: var(--seg-bg); border-radius: 12px; padding: 3px; }
.seg button { flex: 1; min-height: 44px; border: 0; border-radius: 9px; background: transparent; color: var(--fg-2); font-size: 14px; font-weight: 500; padding: 0 4px; }
.seg button[aria-checked="true"] { background: var(--seg-on); color: var(--fg); box-shadow: var(--shadow); }

/* ---------- Chips ---------- */
.chip { display: inline-flex; align-items: center; gap: 4px; background: var(--surface-2); color: var(--fg-2); border-radius: 999px; padding: 4px 10px; font-size: 13px; white-space: nowrap; }
.chip .num { font-size: 13px; }

/* ---------- Tab bar ---------- */
.tabbar { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; background: var(--bar); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-left, 0px)) 6px max(8px, env(safe-area-inset-right, 0px)); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; border: 0; background: transparent; color: var(--fg-2); font-size: 12px; font-weight: 500; text-decoration: none; border-radius: 12px; }
.tab[aria-current="page"] { color: var(--accent); }
.tab-add { justify-self: center; width: 52px; height: 52px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; }

/* ---------- Toast ---------- */
.toast { position: absolute; left: 50%; bottom: 88px; transform: translate(-50%, 8px); max-width: calc(100% - 32px); background: var(--fg); color: var(--bg); padding: 12px 18px; border-radius: 999px; font-size: 15px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; z-index: 30; white-space: nowrap; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- Login ---------- */
.login { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-bottom: 12vh; }
.login h1 { font-size: 40px; font-weight: 700; letter-spacing: -0.03em; margin: 0 0 32px; }
.login label { display: block; font-size: 14px; font-weight: 500; color: var(--fg-2); margin-bottom: 8px; }
.text-input { width: 100%; height: 52px; border: 0; border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); padding: 0 16px; font-size: 17px; }
.field-err { min-height: 22px; margin: 6px 0 10px; font-size: 14px; color: var(--danger); }
.text-input[aria-invalid="true"] { outline: 2px solid var(--danger); }

/* ---------- Início ---------- */
.today-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.today-top .lbl { font-size: 14px; color: var(--fg-2); }
.big { font-size: 44px; line-height: 1.05; font-weight: 600; letter-spacing: -0.03em; }
.unit { font-family: "Geist", system-ui, sans-serif; font-size: 17px; font-weight: 500; color: var(--fg-2); margin-left: 4px; letter-spacing: 0; }
.today-val { margin: 10px 0 14px; }
.mini-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 8px; border-top: 1px solid var(--line); padding-top: 14px; }
.mini .k { display: block; font-size: 12px; color: var(--fg-2); }
.mini .v { font-size: 17px; font-weight: 500; }
.mini .v small { font-family: "Geist", system-ui, sans-serif; font-size: 12px; color: var(--fg-2); margin-left: 2px; }
.empty-msg { margin: 6px 0 16px; color: var(--fg-2); font-size: 15px; }
.week-head { display: flex; align-items: baseline; justify-content: space-between; }
.week-head .count { font-size: 17px; font-weight: 500; }
.days { display: grid; grid-template-columns: repeat(7, 1fr); margin: 16px 0 8px; text-align: center; }
.day { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; color: var(--fg-2); }
.day.is-today .l { color: var(--accent); font-weight: 700; }
.day.is-today .dot { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--fg-3); }
.dot.on { background: var(--fg); border-color: var(--fg); }
.dot.future { opacity: 0.3; }
.vs { margin: 0 0 4px; font-size: 13px; color: var(--fg-2); }
.mrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); min-height: 64px; }
.mrow .k { display: block; font-size: 13px; color: var(--fg-2); }
.mrow .v { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
.mrow .v .unit { font-size: 13px; }

/* ---------- Histórico ---------- */
.hgrid { display: grid; grid-template-columns: 74px 1fr 1fr 1fr 18px; align-items: center; gap: 4px; }
.hcols { font-size: 12px; color: var(--fg-2); padding: 0 16px 8px; }
.hcols span:nth-child(n+2) { text-align: right; }
.week-title { display: flex; justify-content: space-between; align-items: baseline; margin: 24px 4px 8px; font-size: 14px; font-weight: 600; }
.week-title .num { font-weight: 500; color: var(--fg-2); }
.hlist { padding: 4px 0; }
.hrow { width: 100%; min-height: 52px; border: 0; background: transparent; text-align: left; padding: 0 16px; border-radius: 12px; font-size: 15px; }
.hrow + .hrow { box-shadow: inset 0 1px 0 var(--line); }
.havg { min-height: 44px; margin: 4px 8px; padding: 0 8px; border-radius: 10px; background: var(--surface-2); font-size: 15px; font-weight: 600; }
.havg .d { font-family: "Geist", system-ui, sans-serif; font-size: 13px; font-weight: 500; color: var(--fg-2); }
.havg .n { text-align: right; }
.havg .n small { font-size: 11px; font-weight: 400; color: var(--fg-2); margin-left: 2px; }
.hrow .d { font-size: 14px; color: var(--fg-2); }
.hrow .n { text-align: right; }
.hrow .n small { font-size: 11px; color: var(--fg-2); margin-left: 2px; }
.hrow .note { color: var(--fg-3); display: grid; place-items: center; }

/* ---------- Tendências ---------- */
.selwrap { position: relative; }
.selwrap select { appearance: none; -webkit-appearance: none; width: 100%; height: 52px; border: 0; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); padding: 0 44px 0 16px; font-size: 17px; font-weight: 500; }
.selwrap .ic { position: absolute; right: 14px; top: 14px; pointer-events: none; color: var(--fg-2); }
.seg.period { margin: 12px 0; }
.sum { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.sum .k { display: block; font-size: 13px; color: var(--fg-2); margin-bottom: 4px; }
.sum .v { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; }
.sum .v .unit { font-size: 14px; }
.sum .r { text-align: right; }
.readout { min-height: 22px; font-size: 14px; color: var(--fg-2); margin-bottom: 8px; }
.readout b { color: var(--fg); font-weight: 600; }
.chart-wrap { position: relative; height: 240px; touch-action: pan-y; }
.chart-wrap svg { display: block; width: 100%; height: 240px; }
.ax { fill: var(--fg-2); font: 11px "Geist Mono", ui-monospace, monospace; }
.gridline { stroke: var(--line); stroke-width: 1; }
.legend { display: flex; gap: 16px; margin-top: 8px; font-size: 13px; color: var(--fg-2); align-items: center; }
.legend i { display: inline-block; vertical-align: middle; margin-right: 6px; }
.lg-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dot); }
.lg-line { width: 18px; height: 3px; border-radius: 2px; background: var(--accent); }
.note-line { margin: 10px 0 0; font-size: 13px; color: var(--fg-2); }
.empty-chart { height: 240px; display: grid; place-items: center; text-align: center; color: var(--fg-2); font-size: 15px; padding: 0 12px; }
details.tbl { margin-top: 12px; }
details.tbl summary { min-height: 44px; display: flex; align-items: center; font-size: 14px; color: var(--fg-2); cursor: pointer; padding: 0 4px; }
details.tbl table { width: 100%; border-collapse: collapse; font-size: 14px; }
details.tbl th, details.tbl td { text-align: right; padding: 8px 4px; border-top: 1px solid var(--line); }
details.tbl th:first-child, details.tbl td:first-child { text-align: left; }
details.tbl th { font-weight: 500; color: var(--fg-2); }

/* ---------- Ajustes ---------- */
.set-row { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 56px; border: 0; background: transparent; padding: 0; text-align: left; font-size: 17px; }
.set-row + .set-row, .set-block + .set-row { border-top: 1px solid var(--line); }
.set-row.danger { color: var(--danger); }
.set-block { padding: 4px 0 16px; }
.set-block .k { display: block; font-size: 17px; margin-bottom: 12px; }

/* ---------- Registro ---------- */
.reg-head { flex: none; padding-top: 4px; padding-bottom: 6px; border-bottom: 1px solid var(--line); background: var(--bg); }
.reg-cancel { min-height: 44px; padding: 0 8px 0 0; border: 0; background: transparent; font-size: 17px; font-weight: 500; }
.datebar { display: flex; align-items: center; justify-content: space-between; }
.arrow { width: 44px; height: 44px; border: 0; border-radius: 50%; background: var(--surface); color: var(--fg); display: grid; place-items: center; box-shadow: var(--shadow); }
.arrow:disabled { opacity: 0.3; }
.datewrap { position: relative; display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 18px; border-radius: 12px; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
.datewrap:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.datewrap input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; font-size: 16px; border: 0; background: transparent; }
.badge { display: inline-block; background: var(--accent-tint); color: var(--fg); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 500; }
.sec-title { margin: 24px 4px 8px; font-size: 13px; font-weight: 600; color: var(--fg-2); letter-spacing: 0.02em; }
.reg-card { padding: 4px 16px; }
.field { padding: 10px 0 0; }
.field + .field { border-top: 1px solid var(--line); }
.frow { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 48px; }
.flabel { font-size: 16px; font-weight: 500; }
.fhint { display: block; font-size: 12px; font-weight: 400; color: var(--fg-3); min-height: 16px; }
.ctl { display: flex; align-items: center; gap: 4px; }
.ctl input { width: 7.5em; height: 48px; border: 0; border-radius: 12px; background: var(--surface-2); padding: 0 12px; font-size: 20px; text-align: right; }
.ctl input::placeholder { color: var(--fg-3); }
.ctl input[aria-invalid="true"] { box-shadow: inset 0 0 0 2px var(--danger); }
.ctl .u { width: 34px; font-size: 14px; color: var(--fg-2); }
.ctl.sleep input { width: 64px; padding: 0 8px; }
.ctl.sleep .u { width: 22px; }
.step { width: 44px; height: 44px; border: 0; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; }
.ferr { min-height: 22px; padding: 2px 0 4px; font-size: 13px; color: var(--danger); text-align: right; }
.dseg { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 4px 0 6px; }
.dseg button { min-height: 48px; border: 0; border-radius: 12px; background: var(--surface-2); font-size: 18px; font-weight: 500; }
.dseg button[aria-checked="true"] { background: var(--accent); color: var(--accent-fg); font-weight: 600; }
.dcap { display: flex; justify-content: space-between; font-size: 12px; color: var(--fg-3); padding: 0 2px; }
.dcap-pad { min-height: 10px; }
.derived { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 12px 0; }
.derived .k { display: block; font-size: 12px; color: var(--fg-2); }
.derived .v { font-size: 19px; font-weight: 500; }
.derived .v small { font-family: "Geist", system-ui, sans-serif; font-size: 12px; color: var(--fg-2); margin-left: 2px; }
textarea#f-notes { display: block; width: 100%; min-height: 96px; margin: 12px 0; border: 0; border-radius: 12px; background: var(--surface-2); padding: 12px; font-size: 16px; resize: none; }
.del-wrap { display: flex; justify-content: center; margin-top: 20px; }
.reg-foot { flex: none; padding-top: 10px; padding-bottom: 10px; background: var(--bar); border-top: 1px solid var(--line); }

/* ---------- Modal layers ---------- */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 100; }
.dialog { position: fixed; z-index: 101; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(340px, calc(100% - 32px)); background: var(--surface); border-radius: 20px; padding: 22px 20px 16px; box-shadow: var(--shadow); }
.dlg-title { margin: 0 0 8px; font-size: 19px; font-weight: 600; }
.dlg-body { margin: 0 0 18px; color: var(--fg-2); font-size: 15px; }
.dlg-actions { display: flex; flex-direction: column; gap: 8px; }
.dlg-actions .btn { min-height: 48px; }
.sheet { position: fixed; z-index: 101; left: 50%; bottom: 0; transform: translateX(-50%); width: min(430px, 100%); max-height: 86%; overflow-y: auto; background: var(--surface); border-radius: 20px 20px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px)); }
.sheet h2 { font-size: 19px; }
.sheet .grp { margin: 18px 0 8px; font-size: 12px; font-weight: 600; color: var(--fg-2); letter-spacing: 0.04em; }
.jump { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.jump button { min-height: 44px; border: 0; border-radius: 10px; background: var(--surface-2); font-size: 13px; padding: 4px 10px; text-align: left; }
.swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.swatches button { min-height: 64px; border: 2px solid transparent; border-radius: 12px; background: var(--surface-2); font-size: 13px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
.swatches button[aria-checked="true"] { border-color: var(--fg); }
.sw { width: 22px; height: 22px; border-radius: 50%; }
.sw-lime { background: var(--lime); }
.sw-blue { background: var(--blue); }
.sw-amber { background: var(--amber); }
.sw-vivid { background: var(--vivid); }
.proto-note { font-size: 12px; color: var(--fg-2); margin: 14px 0 0; }

.fab { position: fixed; z-index: 90; top: calc(env(safe-area-inset-top, 0px) + 8px); right: max(calc(env(safe-area-inset-right, 0px) + 8px), calc(50% - 207px)); height: 28px; padding: 0 10px; border-radius: 999px; border: 1px dashed var(--fg-3); background: var(--bg); color: var(--fg-2); font: 500 12px "Geist Mono", ui-monospace, monospace; }
.fab::after { content: ""; position: absolute; inset: -8px -6px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}
</style>

<button id="proto-fab" class="fab" type="button" aria-haspopup="dialog">Protótipo</button>

</div>
<div id="layer-root"></div>

<script>
(function () {
  "use strict";

  /* ---------- Constants and helpers ---------- */
  var TODAY = "2026-11-12";

    if (!/^\d+([.,]\d+)?$/.test(txt)) return;
    var d = String(Math.round(parseFloat(txt.replace(",", ".")) * Math.pow(10, FIELDS[k].dec)));
    if (d.length > FIELDS[k].digits) return;
    setDigits(k, d); caretEnd(el);
  });
  ["focusin", "click", "keyup", "select"].forEach(function (ev) {
    screen.addEventListener(ev, function (e) {
      var el = e.target;
      if (el.dataset && el.dataset.field) setTimeout(function () { caretEnd(el); }, 0);
      if (ev === "focusin" && reg && (el.matches("input, textarea"))) setTimeout(function () { el.scrollIntoView({ block: "center", behavior: "smooth" }); }, 300);
    });
  });
  screen.addEventListener("focusout", function (e) {
    var k = e.target.dataset && e.target.dataset.field;
    if (k && reg) { reg.touched[k] = true; renderErrors(); }
  });
  screen.addEventListener("click", function (e) {
    var dateInp = e.target.closest && e.target.closest("#reg-date");
    if (dateInp && dateInp.showPicker) { try { dateInp.showPicker(); } catch (err) { /* native tap handles it */ } }
    var b = e.target.closest && e.target.closest("[data-disp]");
    if (b && reg) { var n = +b.dataset.disp; reg.disp = reg.disp === n ? null : n; refreshDisp(); }
  });
  function refreshDisp() { $$("[data-disp]").forEach(function (b) { b.setAttribute("aria-checked", String(reg.disp === +b.dataset.disp)); }); }

  /* ---------- iOS keyboard: keep the registration column on the visual viewport ---------- */
  function resetKeyboardLayout() { appEl.style.height = ""; root.style.paddingBottom = ""; }
  if (window.visualViewport) {
    var onVV = function () {
      if (!reg || state.route.indexOf("registro") !== 0) return;
      var vv = window.visualViewport;
      if (window.innerHeight - vv.height > 120) {
        var padTop = parseFloat(getComputedStyle(root).paddingTop) || 0;
        root.style.paddingBottom = "0px";
        appEl.style.height = Math.max(200, vv.height - padTop) + "px";
        window.scrollTo(0, 0);
        var a = document.activeElement;
        if (a && a.matches("input, textarea")) a.scrollIntoView({ block: "center" });
      } else resetKeyboardLayout();
    };
    window.visualViewport.addEventListener("resize", onVV);
    window.visualViewport.addEventListener("scroll", onVV);
  }

  /* ---------- Prototype panel ---------- */
  var JUMPS = [
    ["login", "Login"], ["login-erro", "Login com erro"],
    ["inicio", "Início com hoje"], ["inicio-vazio", "Início sem hoje"],
    ["registro", "Registro nova"], ["registro-editar", "Registro editando"],
    ["registro-erro", "Registro com erro"], ["registro-descartar", "Registro descartar?"],
    ["registro-excluir", "Registro excluir?"], ["historico", "Histórico"],
    ["tendencias", "Tendências"], ["ajustes", "Ajustes"]
  ];
  $("#proto-fab").addEventListener("click", function () {
    var jumps = JUMPS.map(function (j) { return '<button type="button" id="jump-' + j[0] + '" data-go="' + j[0] + '">' + j[1] + "</button>"; }).join("");
    var th = [["system", "Sistema"], ["light", "Claro"], ["dark", "Escuro"]].map(function (t) {
      return '<button type="button" role="radio" id="proto-theme-' + t[0] + '" data-theme-value="' + t[0] + '" aria-checked="' + (state.theme === t[0]) + '">' + t[1] + "</button>";
    }).join("");
    var ac = [["lime", "Lima"], ["blue", "Azul"], ["amber", "Âmbar"], ["vivid", "Azul vivo"]].map(function (a) {
      return '<button type="button" role="radio" id="proto-accent-' + a[0] + '" data-accent-value="' + a[0] + '" aria-checked="' + (state.accent === a[0]) + '"><span class="sw sw-' + a[0] + '"></span>' + a[1] + "</button>";
    }).join("");
    openLayer('<div class="scrim" data-scrim></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="proto-title"><h2 id="proto-title">Protótipo</h2>' +
      '<p class="proto-note">Os dados são fictícios e ficam só na memória desta página.</p>' +
      '<div class="grp">IR PARA</div><div class="jump">' + jumps + "</div>" +
      '<div class="grp">TEMA</div><div class="seg" role="radiogroup" aria-label="Tema">' + th + "</div>" +
      '<div class="grp">ACENTO</div><div class="swatches" role="radiogroup" aria-label="Acento">' + ac + "</div>" +
      '<p style="margin:16px 0 0"><button type="button" class="btn ghost block" id="proto-close">Fechar</button></p></div>', { focus: "#proto-close" });
    applyLook();
  });

  /* ---------- Global click actions ---------- */
  document.addEventListener("click", function (e) {
    var t = e.target.closest ? e.target : e.target.parentElement;
    var el;
    if ((el = t.closest("[data-scrim]"))) { if (layer) (layer.onEsc || closeLayer)(); return; }
    if ((el = t.closest("#proto-close"))) { closeLayer(); return; }
    if ((el = t.closest("[data-dlg]"))) { layer.fire(+el.dataset.dlg); return; }
    if ((el = t.closest("[data-go]"))) {
      var n = el.dataset.go;
      closeLayer(true);
      if (n === "inicio") setTodayState(true);
      if (n === "login") state.loginErrShown = false;
      state.pendingDate = null;
      go("#" + n);
      return;
    }
    if ((el = t.closest("[data-theme-value]"))) { state.theme = el.dataset.themeValue; applyLook(); return; }
    if ((el = t.closest("[data-accent-value]"))) { state.accent = el.dataset.accentValue; applyLook(); return; }
    if ((el = t.closest("[data-period]"))) { trend.period = el.dataset.period; drawTrend(); return; }
    if ((el = t.closest("[data-row-date]"))) { state.pendingDate = el.dataset.rowDate; go("#registro-editar"); return; }
    if ((el = t.closest("[data-act]"))) {
      var a = el.dataset.act;
      if (a === "today-register") { state.pendingDate = TODAY; go("#registro"); }
      else if (a === "edit-today") { state.pendingDate = TODAY; go("#registro"); }
      else if (a === "export") toast("CSV exportado");
      else if (a === "import") $("#import-file").click();
      else if (a === "logout") go("#login");
      else if (a === "cancel") { if (reg && isDirty()) askDiscard(); else go(reg ? reg.returnHash || "#inicio" : "#inicio"); }
      else if (a === "save") save();
      else if (a === "delete") askDelete();
      else if (a === "prev-day") changeDate(addDays(reg.date, -1));
      else if (a === "next-day") { if (reg.date < TODAY) changeDate(addDays(reg.date, 1)); }
      else if (a === "sleep-minus") stepSleep(-1);
      else if (a === "sleep-plus") stepSleep(1);
    }
  });

  applyLook();
  route();
})();
</script>
