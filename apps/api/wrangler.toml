# The top level is local dev only; deployed environments live in [env.preview] and [env.production], and [env.e2e] is local real-API E2E only.
# Named environments don't inherit vars or bindings, so each one re-declares everything it needs.
name = "bodylog-dev"
main = "src/index.ts"
compatibility_date = "2026-05-25"

# Placeholder id so an accidental `--remote` without `--env` can't reach deployed data.
[[d1_databases]]
binding = "DB"
database_name = "bodylog-dev"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../../infra/migrations"

[env.production]
name = "bodylog"

[env.production.observability]
enabled = true

[[env.production.d1_databases]]
binding = "DB"
database_name = "bodylog-prod"
database_id = "9b2326c6-b999-41d3-8ce7-6eaf3f5c9043"
migrations_dir = "../../infra/migrations"

# Kept out of the top level: `wrangler dev` fails when ../web/dist is missing.
[env.production.assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[env.preview]
name = "bodylog-preview"

[env.preview.observability]
enabled = true

[[env.preview.d1_databases]]
binding = "DB"
database_name = "bodylog-preview"
database_id = "f1b4910d-f6b3-488f-897c-66b15cc8cc7e"
migrations_dir = "../../infra/migrations"

[env.preview.assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Never deployed: `npm run test:e2e:api` runs it locally with its D1 under .e2e-state/.
[env.e2e]
name = "bodylog-e2e"
main = "src/e2e.ts"

[[env.e2e.d1_databases]]
binding = "DB"
database_name = "bodylog-e2e"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../../infra/migrations"

[env.e2e.assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
