name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  scope:
    name: Determine CI scope
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.scope.outputs.should_run }}
    steps:
      - name: Check event source
        id: scope
        uses: actions/github-script@v8
        with:
          script: |
            if (context.eventName === "pull_request") {
              core.setOutput("should_run", "true");
              core.info("Running CI for a pull request targeting main.");
              return;
            }

            if (context.eventName !== "push") {
              core.setOutput("should_run", "false");
              core.info(`Skipping unsupported event: ${context.eventName}`);
              return;
            }

            const { owner, repo } = context.repo;
            const associatedPullRequests = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              {
                owner,
                repo,
                commit_sha: context.sha,
                per_page: 100,
              },
            );

            const mainPullRequests = associatedPullRequests.filter(
              (pullRequest) => pullRequest.base?.ref === "main",
            );

            const shouldRun = mainPullRequests.length === 0;
            core.setOutput("should_run", shouldRun ? "true" : "false");

            if (shouldRun) {
              core.info("Running CI for a direct push to main.");
            } else {
              core.info("Skipping CI because this main push is associated with a pull request.");
            }

  lint-typecheck:
    name: Lint and typecheck
    needs:
      - scope
    if: needs.scope.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  tests:
    name: Tests
    needs:
      - scope
    if: needs.scope.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Unit and API tests
        run: npm run test:api

      - name: Build frontend
        run: npm run build

      - name: E2E tests
        run: npm run test:e2e
