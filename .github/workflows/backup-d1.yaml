name: Back up D1 (production)

on:
  schedule:
    # 06:17 UTC is 03:17 in São Paulo: the export blocks the database while it runs, so it runs off-peak (ADR 0042).
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Runs never overlap; a failed run is surfaced by GitHub's workflow-failure email.
concurrency:
  group: backup-d1
  cancel-in-progress: false

jobs:
  backup:
    name: Export, verify, encrypt and upload
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check backup configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ vars.B2_BUCKET }}
          B2_ENDPOINT: ${{ vars.B2_ENDPOINT }}
          B2_REGION: ${{ vars.B2_REGION }}
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID B2_KEY_ID B2_APPLICATION_KEY B2_BUCKET B2_ENDPOINT B2_REGION; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secrets or variables:$missing (see docs/operations/backup-and-restore.md)"
            exit 1
          fi
          if ! grep -qE '^age1[0-9a-z]+$' infra/backups/age-recipient.txt; then
            echo "::error::infra/backups/age-recipient.txt has no age1... public key yet (see docs/operations/backup-and-restore.md)"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install age
        run: sudo apt-get update && sudo apt-get install -y age

      # Addressed by binding so the backup doesn't depend on the database name.
      - name: Export production D1
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 export DB --remote --env production --skip-confirmation --output "$RUNNER_TEMP/dump.sql"

      # A dump that doesn't import, or imports empty, is worse than none: fail before uploading it.
      # The import uses the top-level (local-only) binding and a throwaway persist dir, never a remote database.
      - name: Verify the dump imports into a local D1
        working-directory: apps/api
        run: |
          npx wrangler d1 execute DB --local --persist-to "$RUNNER_TEMP/verify" --file "$RUNNER_TEMP/dump.sql"
          for table in measurements d1_migrations; do
            count=$(npx wrangler d1 execute DB --local --persist-to "$RUNNER_TEMP/verify" --json --command "SELECT COUNT(*) AS n FROM $table" | jq '.[0].results[0].n')
            echo "$table: $count rows"
            if [ "$count" -eq 0 ]; then
              echo "::error::$table is empty after importing the dump"
              exit 1
            fi
          done

      - name: Encrypt the dump
        run: age --encrypt --recipients-file infra/backups/age-recipient.txt --output "$RUNNER_TEMP/dump.sql.age" "$RUNNER_TEMP/dump.sql"

      # The key is scoped to the backup bucket; the 30-day lifecycle rule lives on the bucket (ADR 0042).
      - name: Upload to Backblaze B2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.B2_REGION }}
          # AWS CLI 2.23+ adds CRC checksum headers by default, which S3-compatible stores like B2 may reject.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          B2_BUCKET: ${{ vars.B2_BUCKET }}
          B2_ENDPOINT: ${{ vars.B2_ENDPOINT }}
        run: |
          key="bodylog-prod-$(date -u +%Y-%m-%dT%H%M%SZ).sql.age"
          aws s3 cp "$RUNNER_TEMP/dump.sql.age" "s3://$B2_BUCKET/$key" --endpoint-url "$B2_ENDPOINT" --no-progress
          echo "Uploaded \`$key\` to \`$B2_BUCKET\` ($(stat -c %s "$RUNNER_TEMP/dump.sql.age") bytes)" >> "$GITHUB_STEP_SUMMARY"
