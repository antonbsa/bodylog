name: Deploy release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # Always re-run: a release can tag any commit, not only one that was just checked. Called workflows check out the tagged commit.
  code-quality:
    uses: ./.github/workflows/code-quality.yaml

  tests:
    uses: ./.github/workflows/tests.yaml

  deploy:
    name: Deploy to Cloudflare (production)
    needs: [code-quality, tests]
    # Deploys queue instead of overlapping, and one is never cancelled mid-migration.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check production secrets
        run: npm run check-secrets:production

      # Undoing a bad migration restores this bookmark (docs/operations/deploying.md).
      - name: Record D1 Time Travel bookmark
        working-directory: apps/api
        run: |
          info=$(npx wrangler d1 time-travel info DB --env production)
          {
            echo '### D1 bookmark before migrations'
            echo '```'
            echo "$info"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Applies only the migrations not yet recorded in the database, so it is safe on every deploy.
      - name: Apply D1 migrations
        working-directory: apps/api
        run: npx wrangler d1 migrations apply DB --env production --remote

      - name: Build and deploy
        run: npm run deploy
