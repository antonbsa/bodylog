name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  scope:
    name: Determine deploy scope
    runs-on: ubuntu-latest
    outputs:
      is_pr_merge: ${{ steps.scope.outputs.is_pr_merge }}
    steps:
      - name: Check event source
        id: scope
        uses: actions/github-script@v8
        with:
          script: |
            // A push produced by merging a pull request was already validated on
            // that PR by the CI workflow, so we can deploy it without re-running
            // validations. Any other trigger (direct push, manual dispatch) has
            // not been validated yet and must run the validation suite first.
            if (context.eventName !== "push") {
              core.setOutput("is_pr_merge", "false");
              core.info(`Event ${context.eventName}: validating before deploy.`);
              return;
            }

            const { owner, repo } = context.repo;
            const associatedPullRequests = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              {
                owner,
                repo,
                commit_sha: context.sha,
                per_page: 100,
              },
            );

            const mainPullRequests = associatedPullRequests.filter(
              (pullRequest) => pullRequest.base?.ref === "main",
            );

            const isPrMerge = mainPullRequests.length > 0;
            core.setOutput("is_pr_merge", isPrMerge ? "true" : "false");

            if (isPrMerge) {
              core.info("Push came from a merged pull request; validations already ran in CI, deploying directly.");
            } else {
              core.info("Direct push to main; running validations before deploy.");
            }

  validate:
    name: Validate
    needs:
      - scope
    if: needs.scope.outputs.is_pr_merge != 'true'
    uses: ./.github/workflows/validate.yml

  deploy:
    name: Deploy to Cloudflare
    needs:
      - scope
      - validate
    # Deploy on every push to main. The validate job is skipped for PR merges
    # (already validated on the PR) and must succeed otherwise.
    if: >-
      always() &&
      needs.scope.result == 'success' &&
      needs.validate.result != 'failure' &&
      needs.validate.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate deployment configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
          PRODUCTION_FRONTEND_ORIGIN: ${{ vars.PRODUCTION_FRONTEND_ORIGIN }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_PAGES_PROJECT_NAME"
          test -n "$PRODUCTION_FRONTEND_ORIGIN"
          test -n "$VITE_API_BASE_URL"

      - name: Build frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      - name: Deploy API Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PRODUCTION_FRONTEND_ORIGIN: ${{ vars.PRODUCTION_FRONTEND_ORIGIN }}
        run: |
          npm run deploy:api -- \
            --var "PRODUCTION_FRONTEND_ORIGIN:$PRODUCTION_FRONTEND_ORIGIN" \
            --keep-vars

      - name: Deploy frontend Pages project
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          npm run deploy:web -- \
            --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME" \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "$GITHUB_SHA"
